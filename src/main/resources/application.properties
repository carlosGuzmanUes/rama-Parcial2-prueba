# =============================================================================
# CONFIGURACIÓN DE LA BASE DE DATOS
# =============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Evitar advertencias SSL de Neon (opcional)
spring.datasource.hikari.maximum-pool-size=5

# =============================================================================
# ✅ NUEVA: CONFIGURACIÓN DE UPLOAD DE ARCHIVOS
# =============================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# Directorio para almacenar archivos subidos
app.upload.dir=${UPLOAD_DIR:uploads}

# =============================================================================
# CONFIGURACIÓN DE VAADIN
# =============================================================================
vaadin.servlet.productionMode=${VAADIN_PRODUCTION_MODE:true}
vaadin.launch-browser=false

# =============================================================================
# CONFIGURACIÓN DE AUTH0
# =============================================================================
spring.security.oauth2.client.registration.auth0.client-id=${AUTH0_CLIENT_ID}
spring.security.oauth2.client.registration.auth0.client-secret=${AUTH0_CLIENT_SECRET}
spring.security.oauth2.client.registration.auth0.scope=openid,profile,email
spring.security.oauth2.client.registration.auth0.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.auth0.redirect-uri=${AUTH0_REDIRECT_URI}

spring.security.oauth2.client.provider.auth0.issuer-uri=https://${AUTH0_DOMAIN}/
spring.security.oauth2.client.provider.auth0.user-name-attribute=sub

# Variables de Auth0
auth0.domain=${AUTH0_DOMAIN}
auth0.audience=${AUTH0_AUDIENCE}

# =============================================================================
# ✅ NUEVA: CONFIGURACIÓN DE REPORTES Y EVIDENCIAS
# =============================================================================
# Configuración para reportes PDF
app.reports.temp-dir=${REPORTS_TEMP_DIR:temp/reports}
app.reports.max-activities=${REPORTS_MAX_ACTIVITIES:1000}

# Configuración de evidencias
app.evidence.allowed-extensions=${EVIDENCE_EXTENSIONS:.pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx,.ppt,.pptx}
app.evidence.max-file-size=${EVIDENCE_MAX_SIZE:10485760}

# =============================================================================
# CONFIGURACIÓN DE LOGGING
# =============================================================================
logging.level.org.springframework.security=INFO
logging.level.com.vaadin=INFO
# ✅ NUEVA: Logging para las nuevas funcionalidades
logging.level.com.example.rama.service.EvidenceService=${EVIDENCE_LOG_LEVEL:INFO}
logging.level.com.example.rama.service.ReportService=${REPORT_LOG_LEVEL:INFO}
logging.level.org.springframework.web.multipart=${MULTIPART_LOG_LEVEL:WARN}

# =============================================================================
# CONFIGURACIÓN DE PERFILES
# =============================================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =============================================================================
# CONFIGURACIÓN DEL SERVIDOR (RENDER)
# =============================================================================
server.port=${PORT:8080}
server.servlet.context-path=${CONTEXT_PATH:}

# =============================================================================
# ✅ NUEVA: CONFIGURACIÓN DE RENDIMIENTO Y CACHE
# =============================================================================
# Cache para reportes (opcional)
spring.cache.type=${CACHE_TYPE:simple}

# Configuración de hilos para procesamiento asíncrono (opcional)
spring.task.execution.pool.core-size=${TASK_CORE_SIZE:2}
spring.task.execution.pool.max-size=${TASK_MAX_SIZE:8}