# Configuración de la base de datos
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Evitar advertencias SSL de Neon (opcional)
spring.datasource.hikari.maximum-pool-size=5

# =============================================================================
# CONFIGURACIÓN DE VAADIN
# =============================================================================
vaadin.servlet.productionMode=${VAADIN_PRODUCTION_MODE:true}
vaadin.launch-browser=false


# =============================================================================
# CONFIGURACIÓN DE AUTH0
# =============================================================================
spring.security.oauth2.client.registration.auth0.client-id=${AUTH0_CLIENT_ID}
spring.security.oauth2.client.registration.auth0.client-secret=${AUTH0_CLIENT_SECRET}
spring.security.oauth2.client.registration.auth0.scope=openid,profile,email
spring.security.oauth2.client.registration.auth0.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.auth0.redirect-uri=${AUTH0_REDIRECT_URI:https://rama-parcial2-prueba.onrender.com/login/oauth2/code/auth0}

spring.security.oauth2.client.provider.auth0.issuer-uri=https://${AUTH0_DOMAIN}/
spring.security.oauth2.client.provider.auth0.user-name-attribute=sub

# Variables de Auth0
auth0.domain=${AUTH0_DOMAIN}
auth0.audience=${AUTH0_AUDIENCE}

# =============================================================================
# CONFIGURACIÓN DE LOGGING
# =============================================================================
logging.level.org.springframework.security=INFO
logging.level.com.vaadin=INFO

# =============================================================================
# CONFIGURACIÓN DE PERFILES
# =============================================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =============================================================================
# CONFIGURACIÓN DEL SERVIDOR (RENDER)
# =============================================================================
server.port=${PORT:8080}
server.servlet.context-path=${CONTEXT_PATH:}