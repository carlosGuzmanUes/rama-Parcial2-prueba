
# =============================================================================
# CONFIGURACIÓN ESPECÍFICA PARA PRODUCCIÓN
# =============================================================================

# Base de datos
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate para producción
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Pool de conexiones optimizado
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# Vaadin producción
vaadin.servlet.productionMode=true
vaadin.launch-browser=false

# Seguridad - hacer Auth0 opcional en caso de problemas
spring.security.oauth2.client.registration.auth0.client-id=${AUTH0_CLIENT_ID:dummy}
spring.security.oauth2.client.registration.auth0.client-secret=${AUTH0_CLIENT_SECRET:dummy}
spring.security.oauth2.client.registration.auth0.scope=openid,profile,email
spring.security.oauth2.client.registration.auth0.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.auth0.redirect-uri=${AUTH0_REDIRECT_URI:http://localhost:8080/login/oauth2/code/auth0}

spring.security.oauth2.client.provider.auth0.issuer-uri=https://${AUTH0_DOMAIN:dummy.auth0.com}/
spring.security.oauth2.client.provider.auth0.user-name-attribute=sub

# Variables opcionales
auth0.domain=${AUTH0_DOMAIN:dummy.auth0.com}
auth0.audience=${AUTH0_AUDIENCE:dummy}

# Servidor
server.port=${PORT:10000}
server.error.whitelabel.enabled=false

# Logging reducido para producción
logging.level.org.springframework.security=WARN
logging.level.com.vaadin=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.apache.catalina=WARN

# Configuraciones para evitar errores comunes
spring.main.allow-circular-references=true
spring.main.allow-bean-definition-overriding=true

# Upload de archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Directorios
app.upload.dir=uploads
app.reports.temp-dir=temp/reports

# Actuator solo health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never